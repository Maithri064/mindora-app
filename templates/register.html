{% extends "base.html" %}
{% block title %}Create an Account | Mindora{% endblock %}

{% block content %}
<div class="auth-page-wrapper" style="min-height: calc(100vh - 180px); display: flex; align-items: center; justify-content: center; padding: 40px 20px; background: linear-gradient(180deg, #FFF9F3 0%, #FDEEDF 100%);">
    
    <div class="auth-card" style="max-width: 480px; width: 100%; background: #FFFFFF; border: 1.5px solid var(--border-warm); border-radius: 24px; padding: 38px 34px; box-shadow: 0 16px 40px rgba(180, 110, 60, 0.1);">
        
        <!-- Header -->
        <div style="text-align: center; margin-bottom: 26px;">
            <span style="font-size: 38px; display: inline-block; margin-bottom: 6px;">🌱</span>
            <h2 style="font-size: 26px; font-weight: 800; color: #332014; margin-bottom: 6px;">Join Mindora</h2>
            <p style="font-size: 13.5px; color: var(--text-muted); line-height: 1.5;">
                Start tracking your mood patterns with proactive AI emotional guidance.
            </p>
        </div>

        <form action="{{ url_for('register') }}" method="POST">
            <div style="margin-bottom: 16px;">
                <label style="font-size: 13px; font-weight: 700; color: #332014; display: block; margin-bottom: 6px;">
                    Full Name
                </label>
                <input 
                    type="text" 
                    name="name" 
                    required 
                    placeholder="e.g., Alex Johnson"
                    style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--border-warm); background: var(--card-sub); font-size: 14px;"
                >
            </div>

            <div style="margin-bottom: 16px;">
                <label style="font-size: 13px; font-weight: 700; color: #332014; display: block; margin-bottom: 6px;">
                    Email Address
                </label>
                <input 
                    type="email" 
                    name="email" 
                    required 
                    placeholder="name@example.com"
                    style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--border-warm); background: var(--card-sub); font-size: 14px;"
                >
            </div>

            <div style="margin-bottom: 16px;">
                <label style="font-size: 13px; font-weight: 700; color: #332014; display: block; margin-bottom: 6px;">
                    Age
                </label>
                <input 
                    type="number" 
                    name="age" 
                    min="13" 
                    max="100" 
                    value="21" 
                    required
                    style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--border-warm); background: var(--card-sub); font-size: 14px;"
                >
            </div>

            <div style="margin-bottom: 22px;">
                <label style="font-size: 13px; font-weight: 700; color: #332014; display: block; margin-bottom: 6px;">
                    Password
                </label>
                <input 
                    type="password" 
                    name="password" 
                    required 
                    placeholder="••••••••"
                    style="width: 100%; padding: 12px 16px; border-radius: 12px; border: 1.5px solid var(--border-warm); background: var(--card-sub); font-size: 14px;"
                >
            </div>

            <button type="submit" class="btn-pill-orange btn-full" style="width: 100%; padding: 14px; font-size: 15px; font-weight: 800; cursor: pointer;">
                Create Account →
            </button>
        </form>

        <div style="text-align: center; margin-top: 20px; font-size: 13px; color: var(--text-muted);">
            Already have an account? 
            <a href="{{ url_for('login') }}" style="color: var(--orange-hover); font-weight: 700; text-decoration: none;">
                Log in here
            </a>
        </div>
    </div>
</div>
{% endblock %}
